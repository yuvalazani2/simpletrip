<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ניהול ניירת טיולים - שלב 1: פרטי מורה וטיול</title>
    <style>
        :root {
            --primary-color: #2c3e50;
            --accent-color: #3498db;
            --bg-color: #f4f7f6;
            --card-bg: #ffffff;
            --text-color: #333333;
            --border-color: #cccccc;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 650px;
            background-color: var(--card-bg);
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
        }

        h2, h3 {
            color: var(--primary-color);
            text-align: center;
            margin-bottom: 20px;
        }

        h3 {
            border-bottom: 2px solid var(--accent-color);
            padding-bottom: 8px;
            margin-top: 30px;
            text-align: right;
        }

        .form-group {
            margin-bottom: 18px;
        }

        label {
            display: block;
            margin-bottom: 6px;
            font-weight: bold;
        }

        input[type="text"],
        input[type="tel"],
        input[type="number"],
        input[type="date"],
        select {
            width: 100%;
            padding: 11px;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            box-sizing: border-box;
            font-size: 15px;
        }

        .row-group {
            display: flex;
            gap: 15px;
        }

        .row-group div {
            flex: 1;
        }

        .destination-input {
            margin-bottom: 8px;
        }

        .nav-btn, .action-btn {
            background-color: var(--accent-color);
            color: white;
            padding: 12px 20px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 16px;
            width: 100%;
            transition: background 0.3s ease;
        }

        .nav-btn:hover, .action-btn:hover {
            background-color: #2980b9;
        }

        .nav-buttons {
            display: flex;
            justify-content: space-between;
            margin-top: 30px;
            gap: 15px;
        }

        .nav-btn:disabled {
            background-color: #bdc3c7;
            cursor: not-allowed;
        }

        /* Banner styling for clear status feedback */
        #status-msg {
            margin-top: 20px;
            padding: 14px 18px;
            border-radius: 8px;
            text-align: center;
            font-size: 16px;
            font-weight: bold;
            display: none;
        }

        .status-info { 
            background-color: #e8f4f8; 
            color: #1d6f8a; 
            border: 1px solid #bce1ec;
        }
        .status-success { 
            background-color: #d4edda; 
            color: #155724; 
            border: 1px solid #c3e6cb;
        }
        .status-error { 
            background-color: #f8d7da; 
            color: #721c24; 
            border: 1px solid #f5c6cb;
        }

        .hidden { display: none !important; }
    </style>
</head>
<body>

<div class="container">
    <h2>שלב 1: זיהוי ופרטי הטיול</h2>

    <form id="step1-form" onsubmit="return false;">
        <!-- Part 1: Primary Identification Keys -->
        <div id="primary-section">
            <div class="form-group">
                <label for="teacherName">שם המורה:*</label>
                <input type="text" id="teacherName" placeholder="הכנס שם מלא" required>
            </div>

            <div class="form-group">
                <label for="teacherPhone">טלפון המורה:*</label>
                <input type="tel" id="teacherPhone" placeholder="050-0000000" required>
            </div>

            <div class="form-group">
                <label>תאריכי הטיול:*</label>
                <div class="row-group">
                    <div>
                        <label for="startDate" style="font-weight: normal; font-size: 14px;">מתאריך:</label>
                        <input type="date" id="startDate" required>
                    </div>
                    <div>
                        <label for="endDate" style="font-weight: normal; font-size: 14px;">עד תאריך:</label>
                        <input type="date" id="endDate" required>
                    </div>
                </div>
            </div>

            <button type="button" class="action-btn" id="submitKeysBtn" onclick="submitPrimaryKeys()">אישור ובדיקת טיול ב-Drive</button>
        </div>

        <!-- Dynamic Status Message Box -->
        <div id="status-msg" class="status-info"></div>

        <!-- Part 2: Detailed Trip Information (Hidden until keys are submitted) -->
        <div id="trip-details-section" class="hidden">
            <h3>מפרט הטיול</h3>

            <div class="form-group">
                <label for="tripName">שם הטיול:</label>
                <input type="text" id="tripName" placeholder="לדוגמה: טיול שנתון שכבה ט'">
            </div>

            <div class="row-group form-group">
                <div>
                    <label for="studentCount">מספר תלמידים:</label>
                    <input type="number" id="studentCount" min="1" placeholder="0">
                </div>
                <div>
                    <label for="busCount">מספר אוטובוסים:</label>
                    <input type="number" id="busCount" min="1" placeholder="0">
                </div>
            </div>

            <div class="form-group">
                <label for="tripType">סוג הטיול:</label>
                <select id="tripType">
                    <option value="">-- בחר סוג טיול --</option>
                    <option value="סיור עירוני במודיעין">סיור עירוני במודיעין</option>
                    <option value="סיור עירוני מחוץ למודיעין">סיור עירוני מחוץ למודיעין</option>
                    <option value="סיור שטח חד יומי">סיור שטח חד יומי</option>
                    <option value="טיול רב יומי - גדנ״ע, טיול שנתי, סיור מגמה וכו׳">טיול רב יומי (גדנ״ע, טיול שנתי, סיור מגמה וכו׳)</option>
                </select>
            </div>

            <!-- Dynamic Destinations -->
            <div class="form-group">
                <label>יעדי הטיול:</label>
                <div id="destinations-container">
                    <input type="text" class="destination-input" placeholder="יעד 1" oninput="handleDestinationInput(this)">
                </div>
            </div>

            <!-- Navigation Buttons -->
            <div class="nav-buttons">
                <button type="button" class="nav-btn" disabled id="prevBtn">הקודם</button>
                <button type="button" class="nav-btn" id="nextBtn" onclick="saveAndNext()">הבא</button>
            </div>
        </div>
    </form>
</div>

<!-- Load Shared API File -->
<script src="simplytrip-api.js"></script>

<script>
    function showStatus(message, type = 'info') {
        const statusDiv = document.getElementById('status-msg');
        statusDiv.className = `status-${type}`;
        statusDiv.innerText = message;
        statusDiv.style.display = 'block';
    }

    window.onload = () => {
        const localData = getTripData();
        if (localData.teacherName && localData.teacherPhone && localData.startDate && localData.endDate) {
            document.getElementById('teacherName').value = localData.teacherName;
            document.getElementById('teacherPhone').value = localData.teacherPhone;
            document.getElementById('startDate').value = localData.startDate;
            document.getElementById('endDate').value = localData.endDate;
        }
    };

    async function submitPrimaryKeys() {
        const name = document.getElementById('teacherName').value.trim();
        const phone = document.getElementById('teacherPhone').value.trim();
        const start = document.getElementById('startDate').value;
        const end = document.getElementById('endDate').value;

        if (!name || !phone || !start || !end) {
            alert('חובה למלא את שם המורה, טלפון ותאריכי הטיול לפני שניתן להמשיך.');
            document.getElementById('trip-details-section').classList.add('hidden');
            return;
        }

        const primaryData = {
            teacherName: name,
            teacherPhone: phone,
            startDate: start,
            endDate: end
        };

        showStatus('בודק ב-Google Drive אם הטיול קיים...', 'info');

        try {
            const tripId = `${name}_${phone}_${start}_${end}`.replace(/[/\\?%*:|"<>]/g, '-');
            const response = await fetch(SCRIPT_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'text/plain' },
                body: JSON.stringify({
                    action: 'checkOrCreate',
                    tripId: tripId,
                    payload: primaryData
                })
            });

            const result = await response.json();
            
            // Reveal secondary fields section
            document.getElementById('trip-details-section').classList.remove('hidden');

            if (result.status === 'success' && result.data && Object.keys(result.data).length > 4) {
                // TRIP EXISTS
                localStorage.setItem('simplytrip_data', JSON.stringify(result.data));
                populateDetailsForm(result.data);
                showStatus('📂 נמצא טיול קיים ב-Google Drive! הנתונים נטענו לעריכה.', 'success');
            } else {
                // NEW TRIP
                clearDetailsForm();
                localStorage.setItem('simplytrip_data', JSON.stringify(primaryData));
                showStatus('✨ פתחת טיול חדש! תיקייה חדשה נוצרה ב-Drive. אנא הזן את הפרטים למטה.', 'info');
            }
        } catch (e) {
            console.error(e);
            document.getElementById('trip-details-section').classList.remove('hidden');
            showStatus('⚠️ שגיאה בחיבור ל-Drive. פועל כעת במצב מקומי.', 'error');
        }
    }

    function clearDetailsForm() {
        document.getElementById('tripName').value = '';
        document.getElementById('studentCount').value = '';
        document.getElementById('busCount').value = '';
        document.getElementById('tripType').value = '';
        setDestinations(['']);
    }

    function populateDetailsForm(data) {
        if (data.tripName) document.getElementById('tripName').value = data.tripName;
        if (data.studentCount) document.getElementById('studentCount').value = data.studentCount;
        if (data.busCount) document.getElementById('busCount').value = data.busCount;
        if (data.tripType) document.getElementById('tripType').value = data.tripType;
        if (data.destinations) setDestinations(data.destinations);
    }

    function handleDestinationInput(inputElement) {
        const container = document.getElementById('destinations-container');
        const inputs = Array.from(container.getElementsByClassName('destination-input'));
        const lastInput = inputs[inputs.length - 1];

        if (lastInput.value.trim() !== '') {
            const newInput = document.createElement('input');
            newInput.type = 'text';
            newInput.className = 'destination-input';
            newInput.placeholder = `יעד ${inputs.length + 1}`;
            newInput.oninput = function () { handleDestinationInput(this); };
            container.appendChild(newInput);
        }
    }

    function setDestinations(destinationsArray) {
        const container = document.getElementById('destinations-container');
        container.innerHTML = '';

        if (!destinationsArray || destinationsArray.length === 0) {
            destinationsArray = [''];
        }

        destinationsArray.forEach((dest, index) => {
            const newInput = document.createElement('input');
            newInput.type = 'text';
            newInput.className = 'destination-input';
            newInput.placeholder = `יעד ${index + 1}`;
            newInput.value = dest;
            newInput.oninput = function () { handleDestinationInput(this); };
            container.appendChild(newInput);
        });

        const last = container.lastElementChild;
        if (last && last.value.trim() !== '') {
            const newInput = document.createElement('input');
            newInput.type = 'text';
            newInput.className = 'destination-input';
            newInput.placeholder = `יעד ${container.children.length + 1}`;
            newInput.oninput = function () { handleDestinationInput(this); };
            container.appendChild(newInput);
        }
    }

    function getDestinations() {
        const inputs = Array.from(document.getElementsByClassName('destination-input'));
        return inputs.map(input => input.value.trim()).filter(val => val !== '');
    }

    async function saveAndNext() {
        const page1Data = {
            tripName: document.getElementById('tripName').value,
            studentCount: document.getElementById('studentCount').value,
            busCount: document.getElementById('busCount').value,
            tripType: document.getElementById('tripType').value,
            destinations: getDestinations()
        };

        showStatus('שומר נתונים ב-Google Drive...', 'info');
        
        await autoSaveTripData(page1Data);

        window.location.href = 'page2.html';
    }
</script>
</body>
</html>
