<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ניהול ניירת טיולים - מסך אישורים</title>
    <style>
        :root {
            --primary-color: #2c3e50;
            --accent-color: #3498db;
            --bg-color: #f4f7f6;
            --card-bg: #ffffff;
            --text-color: #333333;
            --border-color: #cccccc;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 650px;
            background-color: var(--card-bg);
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
        }

        h2, h3 {
            color: var(--primary-color);
            text-align: center;
            margin-bottom: 20px;
        }

        h3 {
            border-bottom: 2px solid var(--accent-color);
            padding-bottom: 8px;
            margin-top: 25px;
            text-align: right;
        }

        /* Summary Box Styling */
        .summary-card {
            background-color: #f8f9fa;
            border: 1px solid #e9ecef;
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 25px;
        }

        .summary-row {
            display: flex;
            justify-content: space-between;
            padding: 8px 0;
            border-bottom: 1px dashed #dee2e6;
        }

        .summary-row:last-child {
            border-bottom: none;
        }

        .summary-label {
            font-weight: bold;
            color: #495057;
        }

        .summary-value {
            color: #212529;
        }

        .destinations-list {
            margin: 5px 0 0 0;
            padding-right: 20px;
        }

        /* Checkbox Styling */
        .checkbox-group {
            background-color: #ffffff;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            gap: 12px;
            cursor: pointer;
            transition: background-color 0.2s ease;
        }

        .checkbox-group:hover {
            background-color: #f1f8ff;
        }

        .checkbox-group input[type="checkbox"] {
            width: 20px;
            height: 20px;
            cursor: pointer;
            accent-color: var(--accent-color);
        }

        .checkbox-group label {
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin: 0;
            flex-grow: 1;
        }

        .nav-btn {
            background-color: var(--accent-color);
            color: white;
            padding: 12px 20px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 16px;
            width: 100%;
            transition: background 0.3s ease;
        }

        .nav-btn:hover {
            background-color: #2980b9;
        }

        .btn-secondary {
            background-color: #7f8c8d;
        }

        .btn-secondary:hover {
            background-color: #6c757d;
        }

        .nav-buttons {
            display: flex;
            justify-content: space-between;
            margin-top: 30px;
            gap: 15px;
        }

        #status-msg {
            margin-top: 20px;
            padding: 12px 18px;
            border-radius: 8px;
            text-align: center;
            font-size: 15px;
            font-weight: bold;
            display: none;
        }

        .status-info { background-color: #e8f4f8; color: #1d6f8a; border: 1px solid #bce1ec; }
        .status-success { background-color: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
        .status-error { background-color: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }
    </style>
</head>
<body>

<div class="container">
    <h2>מסך אישורים</h2>

    <div id="status-msg" class="status-info"></div>

    <!-- Summary Section -->
    <h3>סיכום פרטי הטיול</h3>
    <div class="summary-card" id="summaryContainer">
        <!-- Dynamic content loaded via JS -->
    </div>

    <!-- Checkboxes Section -->
    <h3>אישורים ועדכונים ראשוניים</h3>
    <form id="step2-form" onsubmit="return false;">
        <div class="checkbox-group" onclick="toggleCheckbox('notifyYuval')">
            <input type="checkbox" id="notifyYuval" onclick="event.stopPropagation()">
            <label for="notifyYuval">יידוע יובל בטיול</label>
        </div>

        <div class="checkbox-group" onclick="toggleCheckbox('notifyKabat')">
            <input type="checkbox" id="notifyKabat" onclick="event.stopPropagation()">
            <label for="notifyKabat">עדכון קב״ט מוס״ח</label>
        </div>

        <!-- Navigation Buttons -->
        <div class="nav-buttons">
            <button type="button" class="nav-btn btn-secondary" onclick="goBack()">הקודם</button>
            <button type="button" class="nav-btn" onclick="saveAndNext()">הבא</button>
        </div>
    </form>
</div>

<!-- Load Shared API File -->
<script src="simplytrip-api.js"></script>

<script>
    function showStatus(message, type = 'info') {
        const statusDiv = document.getElementById('status-msg');
        statusDiv.className = `status-${type}`;
        statusDiv.innerText = message;
        statusDiv.style.display = 'block';
    }

    window.onload = () => {
        loadTripSummary();
        loadLocalStep2Data();
    };

    function loadTripSummary() {
        const data = getTripData();
        const container = document.getElementById('summaryContainer');

        if (!data.teacherName) {
            container.innerHTML = '<p style="color:red; text-align:center;">לא נמצאו נתוני טיול. אנא חזור לעמוד הראשון.</p>';
            return;
        }

        let destinationsHtml = '';
        if (data.destinations && data.destinations.length > 0) {
            destinationsHtml = '<ul class="destinations-list">';
            data.destinations.forEach(d => {
                destinationsHtml += `<li>${d}</li>`;
            });
            destinationsHtml += '</ul>';
        } else {
            destinationsHtml = 'ללא יעדים מוגדרים';
        }

        container.innerHTML = `
            <div class="summary-row">
                <span class="summary-label">שם המורה:</span>
                <span class="summary-value">${data.teacherName || '-'}</span>
            </div>
            <div class="summary-row">
                <span class="summary-label">טלפון המורה:</span>
                <span class="summary-value">${data.teacherPhone || '-'}</span>
            </div>
            <div class="summary-row">
                <span class="summary-label">תאריכים:</span>
                <span class="summary-value">${data.startDate || '-'} עד ${data.endDate || '-'}</span>
            </div>
            <div class="summary-row">
                <span class="summary-label">שם הטיול:</span>
                <span class="summary-value">${data.tripName || '-'}</span>
            </div>
            <div class="summary-row">
                <span class="summary-label">מספר תלמידים:</span>
                <span class="summary-value">${data.studentCount || '0'}</span>
            </div>
            <div class="summary-row">
                <span class="summary-label">מספר אוטובוסים:</span>
                <span class="summary-value">${data.busCount || '0'}</span>
            </div>
            <div class="summary-row">
                <span class="summary-label">סוג הטיול:</span>
                <span class="summary-value">${data.tripType || '-'}</span>
            </div>
            <div class="summary-row" style="flex-direction: column;">
                <span class="summary-label">יעדי הטיול:</span>
                <span class="summary-value">${destinationsHtml}</span>
            </div>
        `;
    }

    function toggleCheckbox(id) {
        const checkbox = document.getElementById(id);
        checkbox.checked = !checkbox.checked;
    }

    function loadLocalStep2Data() {
        const data = getTripData();
        if (data.notifyYuval !== undefined) {
            document.getElementById('notifyYuval').checked = data.notifyYuval;
        }
        if (data.notifyKabat !== undefined) {
            document.getElementById('notifyKabat').checked = data.notifyKabat;
        }
    }

    function goBack() {
        window.location.href = 'index.html';
    }

    async function saveAndNext() {
        const step2Data = {
            notifyYuval: document.getElementById('notifyYuval').checked,
            notifyKabat: document.getElementById('notifyKabat').checked
        };

        showStatus('שומר עדכונים ב-Google Drive...', 'info');

        // Save locally and sync to Google Drive
        await autoSaveTripData(step2Data);

        // Move to Page 3
        window.location.href = 'page3.html';
    }
</script>
</body>
</html>
